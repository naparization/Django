{% extends 'core/base.html' %}

{% block body %}

<body
    style="background-color: rgb(255, 247, 224); margin: 0; min-height: 100vh; font-family: 'Segoe UI', Arial, sans-serif;">

    <div style="display: flex; justify-content: center; align-items: flex-end; margin: 0; height: 100vh;">
        <div
            style="width: 90vh; height: 90vh; align-self: flex-end; background: linear-gradient(160deg, rgb(60,60,60), rgb(40,40,40)); border-radius: 50px 50px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.35); overflow-y: auto;">

            <h1
                style="text-align: center; color: rgb(255,247,224); font-style: italic; font-weight: 700; padding-top: 60px; text-shadow: 0 4px 12px rgba(0,0,0,0.4);">
                Novo Chamado:</h1>

            <div style="text-align: center; justify-content: center; color: white;">
                <form method="POST" action="{% url 'novo_chamado' %}">
                    {% csrf_token %}

                    <div
                        style="display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; padding-bottom: 40px;">

                        <div
                            style="display: flex; flex-direction: column; align-items: flex-start; width: 400px; max-width: 80%;">
                            <label
                                style="margin-bottom: 6px; font-size: 14px; color: rgb(255,247,224); font-weight: 600;">Descrição:</label>
                            <textarea required name="descricao"
                                style="width: 100%; height: 150px; padding: 8px 12px; font-size: 15px; border: 1px solid rgba(255,247,224,0.25); border-radius: 8px; background: rgba(255,247,224,0.08); color: white; box-sizing: border-box; resize: vertical;"
                                placeholder="Descreva o chamado..."></textarea>
                        </div>

                        <div
                            style="display: flex; flex-direction: column; align-items: flex-start; width: 400px; max-width: 80%;">
                            <label
                                style="margin-bottom: 6px; font-size: 14px; color: rgb(255,247,224); font-weight: 600;">Categoria:</label>
                            <select name="categoria"
                                style="width: 100%; padding: 8px 12px; font-size: 15px; border: 1px solid rgba(255,247,224,0.25); border-radius: 8px; background: rgba(255,247,224,0.08); color: white; box-sizing: border-box;">
                                {% for categoria in categorias %}
                                <option value="{{categoria.id}}" style="background-color: rgb(45,45,45); color: white;">
                                    {{categoria.Nome}}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div
                            style="display: flex; flex-direction: column; align-items: flex-start; width: 400px; max-width: 80%;">
                            <label
                                style="margin-bottom: 6px; font-size: 14px; color: rgb(255,247,224); font-weight: 600;">Prioridade:</label>
                            <div class="form-check">
                                <input class="form-check-input" value="1" type="radio" name="prioridade"
                                    id="radioDefault1" checked>
                                <label class="form-check-label" for="radioDefault1"
                                    style="color: rgba(255,247,224,0.85);">
                                    Baixa
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" value="2" type="radio" name="prioridade"
                                    id="radioDefault2">
                                <label class="form-check-label" for="radioDefault2"
                                    style="color: rgba(255,247,224,0.85);">
                                    Média
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" value="3" type="radio" name="prioridade"
                                    id="radioDefault3">
                                <label class="form-check-label" for="radioDefault3"
                                    style="color: rgba(255,247,224,0.85);">
                                    Alta
                                </label>
                            </div>

                        </div>

                        <button type="submit"
                            style="background-color: transparent; color: rgb(255, 247, 224); border: 2px solid rgb(255, 247, 224); font-weight: 600; border-radius: 6px; padding: 8px 18px; transition: all 0.2s ease, color 0.2s ease; text-decoration: none; display: inline-block;"
                            onmouseover="this.style.backgroundColor='rgb(255,247,224)'; this.style.color='rgb(54,54,54)'; this.style.transform='translateY(-2px)';"
                            onmouseout="this.style.backgroundColor='transparent'; this.style.color='rgb(255,247,224)'; this.style.transform='translateY(0)';">Publicar</button>

                    </div>
                </form>
            </div>

        </div>
    </div>

</body>

{% endblock %}
